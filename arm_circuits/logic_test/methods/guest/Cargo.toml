[package]
name = "logic-test-guest"
version = "1.0.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.3", features = ["std", "unstable"] }
anoma-rm-risc0 = { path = "../../../../arm", default-features = false }
anoma-rm-risc0-test-witness = { path = "../../../../arm_tests/arm_test_witness" }
borsh = { version = "1.5", default-features = false, features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }

[features]
borsh = ["dep:borsh", "anoma-rm-risc0/borsh"]
bin = ["dep:bincode"]

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.2-risczero.0" }
