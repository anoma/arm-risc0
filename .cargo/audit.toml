  "RUSTSEC-2025-0119",
  # paste 1.0.15, via alloy-sol-types -> arm_gadgets.
  "RUSTSEC-2024-0436",
  # proc-macro-error2 2.0.1, via alloy-sol-macro -> alloy-sol-types -> arm_gadgets.
  "RUSTSEC-2026-0173",

