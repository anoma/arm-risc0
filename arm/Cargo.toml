[package]
name = "anoma-rm-risc0"
description = "Anoma Resource Machine Implementation using RISC0 zkVM"
version = "1.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
risc0-zkvm = { version = "3.0.3", features = [
  "std",
  "unstable",
], default-features = false, optional = true }

serde = { version = "1.0.197", default-features = false, features = ["derive"] }
serde_with = "3.14.1"
k256 = { version = "=0.13.3", features = [
  "arithmetic",
  "serde",
  "expose-field",
  "std",
  "ecdsa",
  "hash2curve",
], default-features = false, optional = true }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
rand = "0.8"
bincode = "1.3.3"
hex = "0.4"
bytemuck = { version = "1.12", features = ["derive"] }
thiserror = "2.0.6"
borsh = { version = "1.5", default-features = false, features = ["derive"], optional = true }
lazy_static = { version = "1.4", optional = true }
hex-literal = "0.4"

solana-program = { version = "2.1", optional = true }
solana-secp256k1 = { version = "0.1", optional = true }
dashu = { version = "0.4", optional = true }

[features]
default = ["transaction", "prove", "k256"]
k256 = ["dep:k256"]
transaction = ["compliance_circuit", "dep:sha3"]
compliance_circuit = []
zkvm = ["dep:risc0-zkvm", "dep:lazy_static"]
borsh = ["dep:borsh"]
solana = ["transaction", "borsh", "dep:sha2", "dep:solana-program", "dep:solana-secp256k1", "dep:dashu"]
prove = ["zkvm", "risc0-zkvm/prove"]
bonsai = ["zkvm", "risc0-zkvm/bonsai"]
cuda = ["zkvm", "risc0-zkvm/cuda"]
aggregation = ["aggregation_circuit", "transaction"]
aggregation_circuit = []

[dev-dependencies]
k256 = { version = "=0.13.3", features = ["arithmetic", "ecdsa", "std"], default-features = false }
