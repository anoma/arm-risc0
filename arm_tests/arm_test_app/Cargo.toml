[package]
name = "anoma-rm-risc0-test-app"
description = "An Anoma Resource Machine Test Application using RISC0 zkVM"
version = "2.0.0-rc.8"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[dependencies]
anoma-rm-risc0 = { path = "../../arm", version = "2.0.0-rc.8", features = [
  "aggregation",
] }
anoma-rm-risc0-test-witness = { path = "../arm_test_witness", version = "2.0.0-rc.8" }
serde = { version = "1.0.197", default-features = false }
hex = "0.4"
lazy_static = "1.5.0"

[dev-dependencies]
risc0-zkvm = { version = "3.0.3", default-features = false, features = ["std"] }

[features]
default = []
cuda = ["anoma-rm-risc0/cuda"]
prove = ["anoma-rm-risc0/prove"]
bonsai = ["anoma-rm-risc0/bonsai"]
