[package]
name = "execution-proof"
version = "1.0.0"
edition = "2021"

[dependencies]
execution-proof-methods = { path = "methods" }
risc0-zkvm = "3.0.3"
anoma-rm-risc0 = { path = "../../arm", features = [
  "execution_circuit",
], default-features = false }
bincode = "1.3.3"

[features]
default = []
cuda = ["risc0-zkvm/cuda"]
prove = ["risc0-zkvm/prove"]
bonsai = ["risc0-zkvm/bonsai"]
