name: arm-risc0 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RISC0_TOOLCHAIN_VERSION: 3.0.3

jobs:
  taplo:
    name: Taplo Format Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Run Taplo format check
        run: taplo fmt --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt

      - name: Check formatting (main workspace)
        run: cargo fmt --all -- --check

      - name: Check formatting (arm_circuits workspace)
        run: cargo fmt --all -- --check
        working-directory: arm_circuits

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit main workspace
        run: cargo audit

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run clippy (main workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy (aggregation + abi_encoding)
        run: cargo clippy -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --all-targets --features aggregation,abi_encoding,prove -- -D warnings

  build:
    name: Build
    strategy:
      matrix:
        os: [macos-latest]
        rust: ["1.89"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            arm_circuits

      # - name: Install RISC0 toolchain
      #   run: |
      #     curl -L https://risczero.com/install | bash
      #     $HOME/.risc0/bin/rzup install cargo-risczero $RISC0_TOOLCHAIN_VERSION
      #     $HOME/.risc0/bin/rzup install r0vm $RISC0_TOOLCHAIN_VERSION

      - name: Build main workspace
        run: cargo build --workspace --all-targets

      ## Skip building arm_circuits workspace for now due to limited risc0-toolchain download requests
      # - name: Build arm_circuits workspace
      #   run: cargo build --workspace --all-targets
      #   working-directory: arm_circuits

  test:
    name: Test
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest]
        os: [macos-latest]
        rust: ["1.89"]
    runs-on: ${{ matrix.os }}
    env:
      RISC0_DEV_MODE: 1  # Use dev mode for faster testing
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run tests (main workspace)
        run: cargo test --workspace

      - name: Run tests (aggregation + abi_encoding)
        run: cargo test -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --features aggregation,abi_encoding,prove

  test-release:
    name: Test Release
    runs-on: macos-latest
    env:
      RISC0_DEV_MODE: 1  # Use dev mode for faster testing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run release tests (main workspace)
        run: cargo test --workspace --release
        timeout-minutes: 60

      - name: Run release tests (aggregation + abi_encoding)
        run: cargo test -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --release --features aggregation,abi_encoding,prove
        timeout-minutes: 60

  solana:
    name: Solana SBF Build + Graph Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Engine-free dependency graph
        # anoma-rm-core must be unable to link a crypto engine, randomness,
        # or the zkVM: its consumers include Solana programs, where k256
        # curve arithmetic exceeds the SBF stack limits at runtime (it is
        # not enough for the code to merely go uncalled).
        # risc0-zkvm-platform (risc0-zkp's target-shim crate) is expected;
        # the pattern matches crate names exactly.
        run: |
          if cargo tree -p anoma-rm-core --features borsh -e normal \
            | grep -E '(k256|rand|sha3|getrandom|risc0-zkvm) v[0-9]'; then
            echo "ERROR: an engine crate leaked into anoma-rm-core's dependency graph" >&2
            exit 1
          fi

      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build anoma-rm-core for SBF
        run: cargo build-sbf --features borsh
        working-directory: arm_core
