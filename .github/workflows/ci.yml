name: arm-risc0 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RISC0_TOOLCHAIN_VERSION: 3.0.3

jobs:
  taplo:
    name: Taplo Format Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Run Taplo format check
        run: taplo fmt --check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: rustfmt

      - name: Check formatting (main workspace)
        run: cargo fmt --all -- --check

      - name: Check formatting (arm_circuits workspace)
        run: cargo fmt --all -- --check
        working-directory: arm_circuits

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit main workspace
        run: cargo audit

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run clippy (main workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy (aggregation + prove)
        run: cargo clippy -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --all-targets --features aggregation,prove -- -D warnings

  build:
    name: Build
    strategy:
      matrix:
        os: [macos-latest]
        rust: ["1.89"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            arm_circuits

      # - name: Install RISC0 toolchain
      #   run: |
      #     curl -L https://risczero.com/install | bash
      #     $HOME/.risc0/bin/rzup install cargo-risczero $RISC0_TOOLCHAIN_VERSION
      #     $HOME/.risc0/bin/rzup install r0vm $RISC0_TOOLCHAIN_VERSION

      - name: Build main workspace
        run: cargo build --workspace --all-targets

      ## Skip building arm_circuits workspace for now due to limited risc0-toolchain download requests
      # - name: Build arm_circuits workspace
      #   run: cargo build --workspace --all-targets
      #   working-directory: arm_circuits

  test:
    name: Test
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest]
        os: [macos-latest]
        rust: ["1.89"]
    runs-on: ${{ matrix.os }}
    env:
      RISC0_DEV_MODE: 1  # Use dev mode for faster testing
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run tests (main workspace)
        run: cargo test --workspace

      - name: Run tests (aggregation + prove)
        run: cargo test -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --features aggregation,prove

  test-release:
    name: Test Release
    runs-on: macos-latest
    env:
      RISC0_DEV_MODE: 1  # Use dev mode for faster testing
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Run release tests (main workspace)
        run: cargo test --workspace --release
        timeout-minutes: 60

      - name: Run release tests (aggregation + prove)
        run: cargo test -p anoma-rm-risc0 -p anoma-rm-risc0-test-app --release --features aggregation,prove
        timeout-minutes: 60

  solana:
    name: Solana SBF Build + Graph Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: Install Solana toolchain
        # Pinned (like the Rust toolchain above): a floating "stable" can be
        # newer than the version the branch is developed against, and its
        # cargo build-sbf then emits SBPF bytecode versions the pinned
        # validator's feature set does not enable.
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build anoma-rm-core for SBF
        run: cargo build-sbf --features borsh
        working-directory: arm_core

      - name: Engine-free dependency graph
        # anoma-rm-core must be unable to link a crypto engine, randomness,
        # or the zkVM: its consumers include Solana programs, where k256
        # curve arithmetic exceeds the SBF stack limits at runtime (it is
        # not enough for the code to merely go uncalled).
        # risc0-zkvm-platform (risc0-zkp's target-shim crate) is expected;
        # with `--prefix none` every line starts with a crate name, so the
        # anchored pattern matches crate names exactly.
        # anoma-rm-solana is checked for the SBPF v0 and v3 targets its
        # consumers build for: on the host its syscall wrappers fall back to
        # software engines (k256, sha3), which the Solana crates compile only
        # outside `any(target_os = "solana", target_arch = "bpf")`, and other
        # dependencies select on target_os = "solana" or on the
        # static-syscalls target feature alone. Only the platform-tools rustc
        # knows these targets; the SBF build above installed it.
        # Each graph is captured before it is searched, so a failing
        # `cargo tree` fails the step instead of yielding an empty graph.
        run: |
          engines='^(k256|rand|sha3|getrandom|risc0-zkvm|solana-program|keccak|libsecp256k1) v[0-9]'
          check() {
            graph=$(cargo tree -e normal --prefix none "$@")
            if grep -E "$engines" <<<"$graph"; then
              echo "ERROR: an engine crate leaked into the graph of: cargo tree $*" >&2
              exit 1
            fi
          }
          check -p anoma-rm-core --features borsh
          sbf_version=$(cargo build-sbf --version)
          if [[ ! $sbf_version =~ platform-tools\ (v[0-9.]+) ]]; then
            echo "ERROR: no platform-tools version in: $sbf_version" >&2
            exit 1
          fi
          sbf_rustc="$HOME/.cache/solana/${BASH_REMATCH[1]}/platform-tools/rust/bin/rustc"
          if [ ! -x "$sbf_rustc" ]; then
            echo "ERROR: cargo build-sbf installed no rustc at $sbf_rustc" >&2
            exit 1
          fi
          for target in sbpfv0-solana-solana sbpfv3-solana-solana; do
            RUSTC="$sbf_rustc" check -p anoma-rm-solana --target "$target"
          done

      - name: Build anoma-rm-solana for SBF
        run: cargo build-sbf
        working-directory: arm_solana

      # A library build never links, so it cannot catch unresolved syscall
      # symbols; linking a program that calls the verifiers does. Devnet and
      # mainnet run SBPF v3, whose static syscalls resolve differently from v0.
      # Each version gets its own output directory: both builds produce the
      # same file name.
      - name: Link anoma-rm-solana into an SBPF v0 program
        run: cargo build-sbf --sbf-out-dir target/sbpf-v0
        working-directory: arm_solana/sbf_link_check

      - name: Link anoma-rm-solana into an SBPF v3 program
        run: cargo build-sbf --arch v3 --sbf-out-dir target/sbpf-v3
        working-directory: arm_solana/sbf_link_check

      - name: Load both link-check programs
        # Linking can succeed where the loader refuses the ELF: an SBPF v0
        # program that carries static-syscall code links, and the loader
        # rejects it at deployment. Deploying to a local validator runs the
        # loader's verification of each program.
        # The test validator activates every feature, including SIMD-0500
        # (B8JJXCy5..., no deployment of SBPF v0-v2), which devnet and
        # mainnet have not activated; it is deactivated so the v0 program
        # is verified as those clusters verify it.
        working-directory: arm_solana/sbf_link_check
        run: |
          work=$(mktemp -d)
          solana-keygen new --no-bip39-passphrase --silent --outfile "$work/payer.json"
          payer=$(solana-keygen pubkey "$work/payer.json")
          solana-test-validator --quiet --ledger "$work/ledger" --mint "$payer" \
            --deactivate-feature B8JJXCy5amZyWG9r7EnUYLwzXSXTxG7GZ1qZ1qggo83g &
          validator=$!
          trap 'kill "$validator"' EXIT
          rpc=http://127.0.0.1:8899
          # Poll the RPC until it answers; give up after 60 seconds.
          for attempt in $(seq 60); do
            if ! kill -0 "$validator"; then
              cat "$work/ledger/validator.log" >&2
              echo "ERROR: solana-test-validator exited before its RPC answered" >&2
              exit 1
            fi
            if solana cluster-version --url "$rpc"; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "ERROR: solana-test-validator RPC did not answer within 60 seconds" >&2
              exit 1
            fi
            sleep 1
          done
          for arch in v0 v3; do
            solana program deploy --url "$rpc" --keypair "$work/payer.json" \
              "target/sbpf-$arch/anoma_rm_solana_sbf_link_check.so"
          done
