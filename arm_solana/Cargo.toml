[package]
name = "anoma-rm-solana"
version = "1.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arm-core = { package = "anoma-rm-core", path = "../arm_core", features = [
  "borsh",
] }
solana-program = "2.1"
solana-secp256k1 = "0.2.1"
sha2 = "0.10"
bytemuck = { version = "1.12", features = ["derive"] }
thiserror = "2.0.6"

[dev-dependencies]
k256 = { version = "=0.13.3", features = ["arithmetic", "ecdsa", "std"] }
