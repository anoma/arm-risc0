[package]
name = "anoma-rm-solana-sbf-link-check"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone workspace: this program is built only by `cargo build-sbf`,
# never by the host workspace above it. anoma-rm-solana requires resolver "2"
# or later (see its target-specific solana-secp256k1 entry).
[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[dependencies]
anoma-rm-core = { path = "../../arm_core", features = ["borsh"] }
anoma-rm-solana = { path = ".." }
borsh = { version = "1.5", default-features = false }
solana-account-info = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = "3"

# Consumed by solana-program-entrypoint's `entrypoint!` expansion: enabling
# either replaces its default heap allocator or panic handler.
[features]
custom-heap = []
custom-panic = []

# The `entrypoint!` expansion selects on target_os = "solana", which rustc
# only knows as a target of the platform-tools toolchain.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
] }
